name: DAST

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: OWASP ZAP API scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Docker version
        run: docker version

      - name: Run dynamic application security testing
        env:
          ZAP_REPORT_DIR: ${{ runner.temp }}/zap-reports
        run: bash scripts/dast-scan.sh

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-dast-reports
          path: ${{ runner.temp }}/zap-reports
          if-no-files-found: warn
          retention-days: 14
