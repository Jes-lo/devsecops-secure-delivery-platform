name: Container Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-validation:
    name: Secure container
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Docker
        run: |
          docker version

      - name: Build and validate hardened container
        run: |
          bash scripts/container-test.sh
